{% extends "admin/base.html" %}
{% block content %}
<form class="login" method="post">
  <h1>{{ site_name }} admin</h1>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="pw">Parol</label>
  <input class="field big" id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
  {% if error %}<p class="hint err-text">{{ error }}</p>{% endif %}
  <button class="btn" type="submit">Kirish</button>
</form>
{% endblock %}
